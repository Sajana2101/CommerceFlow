services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CommerceFlowSql123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - commerceflow-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CommerceFlowSql123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - commerceflow-redis-data:/data

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: commerceflow
      RABBITMQ_DEFAULT_PASS: CommerceRabbit123!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - commerceflow-rabbitmq-data:/var/lib/rabbitmq

  api:
    build:
      context: .
      dockerfile: CommerceFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__CommerceFlowDatabase: "Server=sqlserver,1433;Database=CommerceFlowDb;User Id=sa;Password=CommerceFlowSql123!;TrustServerCertificate=True"

      Jwt__Issuer: "CommerceFlow.Api"
      Jwt__Audience: "CommerceFlow.Client"
      Jwt__ExpirationMinutes: "60"
      Jwt__Key: "CommerceFlowDockerJwtSigningKey-ChangeThis-2026-Secure-123456789!"

      Redis__Configuration: "redis:6379"
      Redis__InstanceName: "CommerceFlow:"

      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "commerceflow"
      RabbitMq__Password: "CommerceRabbit123!"
      RabbitMq__ExchangeName: "commerceflow.events"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  notificationservice:
    build:
      context: .
      dockerfile: CommerceFlow.NotificationService/Dockerfile

    environment:
      DOTNET_ENVIRONMENT: "Development"

      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "commerceflow"
      RabbitMq__Password: "CommerceRabbit123!"
      RabbitMq__ExchangeName: "commerceflow.events"

    depends_on:
      rabbitmq:
        condition: service_started

volumes:

  commerceflow-sql-data:

  commerceflow-redis-data:

  commerceflow-rabbitmq-data: